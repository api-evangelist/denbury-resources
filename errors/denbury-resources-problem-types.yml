generated: '2026-09-06'
method: probed
source: >-
  live error responses from https://www.denbury.com/wp-json (2026-09-06) + the 4xx responses declared
  in openapi/
description: >-
  Error catalogue for the WordPress core REST API behind www.denbury.com. Denbury publishes no error
  reference — it publishes no developer documentation at all — so every entry below was produced by
  making the failing request and recording the exact body the server returned. Nothing is inferred.
format: wordpress-rest
rfc9457: false
content_type: application/json
envelope:
  code: machine-readable error slug
  message: human-readable sentence
  data:
    status: HTTP status repeated in the body
    params: map of offending parameter -> explanation (validation failures)
    details: per-parameter object carrying its own code/message/data (validation failures)
problem_types:
- code: rest_invalid_param
  status: 400
  title: Invalid parameter
  detail: One or more query parameters failed validation against the route's published schema.
  remediation: >-
    Read data.params and data.details for the specific bound that was violated, then re-issue within
    range. The per-route parameter schemas in openapi/ carry the same bounds.
  observed: 'GET /wp/v2/pages?per_page=999 -> {"code":"rest_invalid_param","message":"Invalid parameter(s): per_page","data":{"status":400,"params":{"per_page":"per_page must be between 1 (inclusive) and 100 (inclusive)"}}}'
  method: probed
- code: rest_out_of_bounds
  status: 400
  title: Parameter out of bounds
  detail: >-
    Nested detail code returned inside data.details of a rest_invalid_param response when a numeric
    parameter falls outside its documented minimum/maximum.
  remediation: Clamp the value to the range in the route's schema (per_page is 1..100).
  observed: 'data.details.per_page.code = "rest_out_of_bounds" on GET /wp/v2/pages?per_page=999'
  method: probed
- code: rest_post_invalid_id
  status: 404
  title: Invalid post ID
  detail: The numeric id in the path does not resolve to a readable item of that type.
  remediation: List the collection first and use an id it returns; ids are not stable across content migrations.
  observed: 'GET /wp/v2/pages/999999 -> {"code":"rest_post_invalid_id","message":"Invalid post ID.","data":{"status":404}}'
  method: probed
- code: rest_no_route
  status: 404
  title: No route
  detail: No registered route matches the URL and method.
  remediation: >-
    Fetch https://www.denbury.com/wp-json/ and check the routes[] index — 276 routes across 14
    namespaces were registered at capture, of which only the ones in openapi/ are anonymously useful.
  observed: 'GET /wp/v2/nope -> {"code":"rest_no_route","message":"No route was found matching the URL and request method.","data":{"status":404}}'
  method: probed
- code: rest_forbidden_context
  status: 401
  title: Context not permitted
  detail: The requested `context` (edit) exposes fields the anonymous caller may not read.
  remediation: Use context=view (the default) or context=embed. The edit context requires application-password credentials.
  observed: 'GET /wp/v2/pages?context=edit -> {"code":"rest_forbidden_context","message":"Sorry, you are not allowed to edit posts in this post type.","data":{"status":401}}'
  method: probed
- code: rest_forbidden
  status: 401
  title: Forbidden
  detail: The whole route requires authentication.
  remediation: >-
    Not remediable by a third party — Denbury issues no credentials. Observed on the entire
    wp-abilities/v1 namespace.
  observed: 'GET /wp-json/wp-abilities/v1/abilities -> {"code":"rest_forbidden","message":"Sorry, you are not allowed to do that.","data":{"status":401}}'
  method: probed
non_json_errors:
- status: 403
  surface: /wp/v2/users and every path under /.well-known/
  detail: >-
    The origin (nginx) answers with an HTML "403 Forbidden" page rather than a JSON envelope. A
    client parsing responses as JSON will fail here; branch on content-type.
  method: probed
