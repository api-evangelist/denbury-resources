aid: denbury-resources
name: Denbury Resources
description: >-
  Denbury Resources (now Denbury Inc.) was an independent oil and natural gas company headquartered in
  Plano, Texas, focused on enhanced oil recovery (EOR) using carbon dioxide injection in mature oil
  fields across the Gulf Coast and Rocky Mountain regions, and on carbon capture, transport and
  sequestration through the largest CO2 pipeline network in the United States. ExxonMobil acquired
  Denbury in November 2023 and it now operates as a subsidiary inside ExxonMobil's Low Carbon
  Solutions business; Denbury filed a Form 15-12G to deregister its securities on 2023-11-22 and has
  filed nothing with the SEC since. Denbury is an energy operator rather than a software vendor and
  publishes no commercial or developer-facing product API, no developer portal, and no SDKs. The only
  machine-readable interface it exposes is the WordPress core REST content API behind its corporate
  website at www.denbury.com, which is captured here for discovery purposes and is anonymously
  readable but read-only.
