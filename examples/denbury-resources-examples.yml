- operation: getOembed
  request: GET /oembed/1.0/embed?url=https%3A%2F%2Fwww.denbury.com%2Foperations%2Fcarbon-solutions%2F
  status: 200
  response: |
    {"version": "1.0", "provider_name": "Denbury", "provider_url": "https://www.denbury.com",
     "author_name": "squiresadmin", "author_url": "https://www.denbury.com/author/squiresadmin/",
     "title": "Carbon Solutions - Denbury", "type": "rich", "width": 600, "height": 338,
     "html": "<blockquote class=\"wp-embedded-content\" ...><a href=\"https://www.denbury.com/operations/carbon-solutions/\">Carbon Solutions</a></blockquote><iframe sandbox=\"allow-scripts\" security=\"restricted\" src=\"https://www.denbury.com/operations/carbon-solutions/embed/#?secret=...\" width=\"600\" height=\"338\" ...></iframe>"
