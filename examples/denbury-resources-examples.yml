description: >-
  Request/response examples for every operation in openapi/. Denbury Inc. publishes no documentation
  and therefore no examples; each response body below was captured by actually issuing the request
  anonymously on 2026-09-06 and is reproduced as returned (large collection responses are shown as a
  single representative element with `_fields` applied, and the field list used is stated). Nothing
  here is synthesised.
base_url: https://www.denbury.com/wp-json
authentication: none
examples:
- operation: listPages
  request: GET /wp/v2/pages?per_page=2&page=2
  status: 200
  response_headers:
    X-WP-Total: '48'
    X-WP-TotalPages: '24'
    Link: <https://www.denbury.com/wp-json/wp/v2/pages?per_page=2&page=1>; rel="prev", <https://www.denbury.com/wp-json/wp/v2/pages?per_page=2&page=3>; rel="next"
    Allow: GET
  note: >-
    Body is an array of full page objects and is large; see getPage for the element shape. The
    headers are the load-bearing part of this example — they are how a client sizes and walks the
    collection.
- operation: getPage
  request: GET /wp/v2/pages/31?_fields=id,date,slug,status,type,link,title,parent,author,featured_media,menu_order,template
  status: 200
  response: |
    {"id": 31, "date": "2022-09-01T21:47:52", "slug": "carbon-solutions", "status": "publish",
     "type": "page", "link": "https://www.denbury.com/operations/carbon-solutions/",
     "title": {"rendered": "Carbon Solutions"}, "author": 1, "featured_media": 0,
     "parent": 14, "menu_order": 11, "template": ""}
  note: >-
    `_fields` was applied to keep the example readable; without it the object also carries
    content.rendered, excerpt.rendered, guid, class_list, meta and _links. parent=14 is the
    Operations page; author=1 is not resolvable (/wp/v2/users returns 403).
- operation: listMedia
  request: GET /wp/v2/media?media_type=application&per_page=1&_fields=id,date,slug,type,link,title,author,media_type,mime_type,source_url,filename,filesize,post
  status: 200
  response: |
    [{"id": 3507, "date": "2023-08-23T13:18:35", "slug": "denbury-contractor-code-of-conduct-r4",
      "type": "attachment", "link": "https://www.denbury.com/denbury-contractor-code-of-conduct-r4/",
      "title": {"rendered": "Denbury Contractor Code of Conduct-R4"}, "author": 1,
      "media_type": "file", "mime_type": "application/pdf", "post": null,
      "source_url": "https://www.denbury.com/wp-content/uploads/2023/08/Denbury-Contractor-Code-of-Conduct-R4.pdf",
      "filename": "Denbury-Contractor-Code-of-Conduct-R4.pdf", "filesize": 6724473}]
  note: >-
    `media_type=application` is the filter that isolates documents from imagery. Download via
    source_url, not link (link is the WordPress attachment page).
- operation: getMediaItem
  request: GET /wp/v2/media/3507
  status: 200
  note: Returns the same object as above without _fields, plus media_details, alt_text, caption and _links.
- operation: search
  request: GET /wp/v2/search?search=carbon%20sequestration&per_page=2
  status: 200
  response: |
    [{"id": 634, "title": "Carbon Sequestration",
      "url": "https://www.denbury.com/operations/carbon-solutions/carbon-sequestration/",
      "type": "post", "subtype": "page"},
     {"id": 31, "title": "Carbon Solutions",
      "url": "https://www.denbury.com/operations/carbon-solutions/",
      "type": "post", "subtype": "page"}]
  note: >-
    _links elided for readability; each result carries a self link with targetHints.allow ["GET"].
    Resolve subtype=page against /wp/v2/pages/{id} and subtype=attachment against /wp/v2/media/{id}.
- operation: listTaxonomies
  request: GET /wp/v2/taxonomies
  status: 200
  response: |
    {"category": {"name": "Categories", "slug": "category", "description": "", "types": ["post"],
                  "hierarchical": true, "rest_base": "categories", "rest_namespace": "wp/v2"},
     "post_tag": {"name": "Tags", "slug": "post_tag", "description": "", "types": ["post"],
                  "hierarchical": false, "rest_base": "tags", "rest_namespace": "wp/v2"}}
  note: _links elided. rest_base + rest_namespace tell a client where each term collection lives.
- operation: getTaxonomy
  request: GET /wp/v2/taxonomies/category
  status: 200
  note: Returns the single `category` object shown above.
- operation: listTypes
  request: GET /wp/v2/types
  status: 200
  note: >-
    Returns a map keyed by type slug (post, page, attachment, ...), each with name, slug, rest_base,
    rest_namespace, hierarchical, has_archive, taxonomies and supports.
- operation: getType
  request: GET /wp/v2/types/page
  status: 200
  note: Returns the single `page` type object.
- operation: listCategories
