site_collapse:
  observed: '2026-09-06'
  detail: >-
    The human website has been collapsed to a handful of legal and contact pages while the REST API
    still serves the full corporate corpus. Every one of the 48 published pages was fetched at the
    `link` its own API record advertises: 41 of the 48 answer HTTP 200 but land on the homepage
    (https://www.denbury.com/), one 301s off-site to jobs.denbury.com, one lands on a spreadsheet
    download, and only 5 resolve to themselves. The full HTML bodies of the redirected pages remain
    intact and anonymously readable through /wp/v2/pages/{id} — page 31 "Carbon Solutions" returns
    17,650 characters of content.rendered, page 1170 "Managing our Carbon Footprint" returns 17,233.
  consequence: >-
    For 41 pages of Denbury's carbon-solutions, EOR, pipeline-network and sustainability material,
    the REST API is now the only public route to the content. That is a lifecycle signal, not a
    feature: the site is being wound down around an API nobody switched off.
  method: probed
