    Versioning is whatever WordPress core ships. The namespace in the path is the version; Denbury
    neither pins it nor announces changes to it. A WordPress core upgrade can add, alter or retire
    routes on this host with no notice to any consumer.
  source: https://www.denbury.com/wp-json/
