corporate_lifecycle:
  status: acquired-subsidiary
  detail: >-
    ExxonMobil completed its acquisition of Denbury on 2023-11-02. Denbury filed a Form 15-12G on
    2023-11-22 to deregister its securities and has filed nothing with the SEC since (last filing of
    any kind: SC 13G/A, 2024-02-07). The corporate site remains live and is maintained — the footer
    reads "© COPYRIGHT 2026 DENBURY INC." and the homepage carries a banner directing visitors to
    ExxonMobil.com — but it is a legacy property inside ExxonMobil's Low Carbon Solutions business.
