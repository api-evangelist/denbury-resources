description: >-
  Lifecycle posture for the only machine-readable surface Denbury Inc. operates. There is no
  published versioning policy, no deprecation policy, no SLA and no status page, because there is no
  developer program to attach one to. What there IS, and what a consumer of this surface actually
  needs to weigh, is corporate lifecycle risk: the company was acquired and deregistered, and the
  site is maintained as a legacy property.
