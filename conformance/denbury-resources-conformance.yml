- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returns HTTP 403 with an nginx HTML body.
- id: rfc9457
  conforms: false
  evidence: >-
    Errors are the WordPress {code,message,data} envelope served as application/json. No
