- id: rfc8288-link-pagination
  conforms: true
  evidence: >-
    GET /wp/v2/pages?per_page=2&page=2 returned `Link: <...page=1>; rel="prev", <...page=3>;
    rel="next"` on 2026-09-06.
- id: pagination
  conforms: true
  evidence: >-
    Page-number pagination with page/per_page/offset, plus X-WP-Total and X-WP-TotalPages counters.
    per_page bounds (1..100) are enforced with a 400.
- id: idempotency
  conforms: false
  evidence: >-
    Not applicable rather than absent — the public surface is read-only (`Allow: GET`). See
    conventions/denbury-resources-conventions.yml idempotency.coverage = na.
- id: oembed-1.0
  conforms: true
  evidence: >-
    GET /oembed/1.0/embed?url=https%3A%2F%2Fwww.denbury.com%2F returned HTTP 200 with a well-formed
