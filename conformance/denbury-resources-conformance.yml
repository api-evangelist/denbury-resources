- id: json-schema
  conforms: true
  evidence: >-
    Every route publishes a JSON Schema for its resource and its arguments in response to HTTP
    OPTIONS. The specs in openapi/ are derived from those documents verbatim.
- id: cors
  conforms: true
  evidence: >-
    `Access-Control-Expose-Headers: X-WP-Total, X-WP-TotalPages, Link` and
    `Access-Control-Allow-Headers: Authorization, X-WP-Nonce, Content-Disposition, Content-MD5,
    Content-Type` returned on wp-json responses.
- id: scim
  conforms: false
  evidence: No SCIM schema URN or /scim surface exists; the users route returns 403.
- id: odata
  conforms: false
  evidence: No $metadata document and no OData query syntax on any route.
